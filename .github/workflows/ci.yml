name: PRAVAH CI & Release Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Test Suite
        env:
          ENVIRONMENT: test
          MONGODB_URI: ""
          JWT_SECRET: "ci-validation-test-signing-secret-key-32chars"
        run: |
          pytest -v backend/tests

      - name: Validate Demo Data Seed Script
        env:
          ENVIRONMENT: test
          MONGODB_URI: ""
        run: |
          python -m backend.seed_demo_data

  frontend-checks:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
