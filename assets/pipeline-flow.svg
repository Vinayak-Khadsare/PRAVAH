<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18372D" />
      <stop offset="100%" stop-color="#0F2E22" />
    </linearGradient>

    <linearGradient id="copperLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8734E" />
      <stop offset="50%" stop-color="#F2C09C" />
      <stop offset="100%" stop-color="#B8734E" />
    </linearGradient>

    <style>
      @keyframes activePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes signalSweep {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes alertBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      .card-pulse { animation: activePulse 4s ease-in-out infinite; transform-origin: center; }
      .signal { stroke-dasharray: 10 10; animation: signalSweep 4s linear infinite; }
      .alert-dot { animation: alertBlink 1.5s ease-in-out infinite; }
      .text-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans", sans-serif; }
      .text-code { font-family: "IBM Plex Mono", Consolas, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="12" fill="#0C2017" stroke="#234B3C" stroke-width="1.5" />

  <!-- Title Ribbon -->
  <g transform="translate(30, 24)">
    <text x="0" y="20" fill="#F7F4EC" font-size="20" font-weight="bold" class="text-base">Statutory Regulatory Engine &bull; The 3 Core Inquiries</text>
    <text x="0" y="40" fill="#D6926F" font-size="12" class="text-code">REAL-TIME TELEMETRY &bull; CASE APP-2026-00124 (DRONACHARYA INSTITUTE)</text>
  </g>

  <!-- Flow Connector Line -->
  <line x1="160" y1="210" x2="840" y2="210" stroke="url(#copperLine)" stroke-width="3" class="signal" />

  <!-- 3 Inquiry Cards -->
  <!-- Card 1: What is pending? -->
  <g transform="translate(30, 90)">
    <rect width="290" height="240" rx="10" fill="url(#panelGrad)" stroke="#234B3C" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#234B3C" />
    <text x="32" y="38" text-anchor="middle" fill="#F7F4EC" font-size="16" font-weight="bold" class="text-code">1</text>
    <text x="60" y="32" fill="#F7F4EC" font-size="15" font-weight="bold" class="text-base">What is pending?</text>
    <text x="60" y="48" fill="#D6926F" font-size="11" class="text-code">DEFICIENCY BREAKDOWN</text>

    <!-- Details -->
    <g transform="translate(16, 75)">
      <rect width="258" height="42" rx="6" fill="#132B20" stroke="#B8734E" stroke-opacity="0.4" />
      <circle cx="16" cy="21" r="5" fill="#B84040" class="alert-dot" />
      <text x="32" y="18" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-base">30-Yr Land Lease Deed</text>
      <text x="32" y="32" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-code">Folio #429 &bull; SRO Greater Noida</text>
    </g>

    <g transform="translate(16, 127)">
      <rect width="258" height="42" rx="6" fill="#132B20" stroke="#234B3C" />
      <circle cx="16" cy="21" r="5" fill="#E2A03F" />
      <text x="32" y="18" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-base">Cadre Ratio Disparity</text>
      <text x="32" y="32" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-code">Faculty shortage: 2 Assoc. Prof</text>
    </g>

    <g transform="translate(16, 179)">
      <rect width="258" height="42" rx="6" fill="#132B20" stroke="#234B3C" />
      <circle cx="16" cy="21" r="5" fill="#38A169" />
      <text x="32" y="18" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-base">Fire Safety NOC (Valid)</text>
      <text x="32" y="32" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-code">SHA-256: d8f3a9e107c... (OK)</text>
    </g>
  </g>

  <!-- Card 2: Why is it blocked? -->
  <g transform="translate(355, 90)">
    <rect width="290" height="240" rx="10" fill="url(#panelGrad)" stroke="#B8734E" stroke-width="1.5" class="card-pulse" />
    
    <!-- Header -->
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#B8734E" />
    <text x="32" y="38" text-anchor="middle" fill="#F7F4EC" font-size="16" font-weight="bold" class="text-code">2</text>
    <text x="60" y="32" fill="#F7F4EC" font-size="15" font-weight="bold" class="text-base">Why is it blocked?</text>
    <text x="60" y="48" fill="#D6926F" font-size="11" class="text-code">STATUTORY CITATION</text>

    <!-- Details -->
    <g transform="translate(16, 75)">
      <rect width="258" height="50" rx="6" fill="#241B15" stroke="#B8734E" stroke-width="1" />
      <text x="12" y="20" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-base">Rule Citation: APH 2.4.1</text>
      <text x="12" y="36" fill="#D6926F" font-size="10" class="text-code">Mandatory 30-Year Registered Lease</text>
    </g>

    <g transform="translate(16, 135)">
      <rect width="258" height="85" rx="6" fill="#132B20" stroke="#234B3C" />
      <text x="12" y="22" fill="#D6926F" font-size="10" font-weight="bold" class="text-code">TIMELINE OVERDUE GAUGE</text>
      
      <!-- Progress Bar -->
      <rect x="12" y="32" width="234" height="8" rx="4" fill="#0C2017" />
      <rect x="12" y="32" width="234" height="8" rx="4" fill="#B84040" />
      
      <text x="12" y="58" fill="#F7F4EC" font-size="12" font-weight="bold" class="text-code">Runway: +24h Overdue</text>
      <text x="12" y="74" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-base">Statutory 15-day scrutiny ceiling exceeded</text>
    </g>
  </g>

  <!-- Card 3: What happens next? -->
  <g transform="translate(680, 90)">
    <rect width="290" height="240" rx="10" fill="url(#panelGrad)" stroke="#234B3C" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="16" y="16" width="32" height="32" rx="6" fill="#397553" />
    <text x="32" y="38" text-anchor="middle" fill="#F7F4EC" font-size="16" font-weight="bold" class="text-code">3</text>
    <text x="60" y="32" fill="#F7F4EC" font-size="15" font-weight="bold" class="text-base">What action next?</text>
    <text x="60" y="48" fill="#38A169" font-size="11" class="text-code">ROLE-AWARE INTERVENTION</text>

    <!-- Details -->
    <g transform="translate(16, 75)">
      <rect width="258" height="42" rx="6" fill="#132B20" stroke="#38A169" stroke-width="1" />
      <text x="12" y="18" fill="#38A169" font-size="11" font-weight="bold" class="text-base">Prerogative: 48h Grace Notice</text>
      <text x="12" y="32" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-code">Regional Officer statutory extension</text>
    </g>

    <g transform="translate(16, 127)">
      <rect width="258" height="42" rx="6" fill="#132B20" stroke="#234B3C" />
      <text x="12" y="18" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-base">Issue Form-B Deficiency</text>
      <text x="12" y="32" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-code">Digital notice + 7-day cure window</text>
    </g>

    <g transform="translate(16, 179)">
      <rect width="258" height="42" rx="6" fill="#132B20" stroke="#234B3C" />
      <text x="12" y="18" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-base">Escalate to SAC Appeals</text>
      <text x="12" y="32" fill="#EDE7D8" fill-opacity="0.7" font-size="10" class="text-code">Referral to Standing Appeals Panel</text>
    </g>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(30, 360)">
    <rect width="940" height="36" rx="6" fill="#132B20" />
    <circle cx="20" cy="18" r="4" fill="#38A169" />
    <text x="36" y="22" fill="#F7F4EC" font-size="11" class="text-code">WORKFLOW AUDIT: All actions recorded to cryptographic SHA-256 chained ledger with actor attribution.</text>
  </g>
</svg>
