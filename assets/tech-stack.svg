<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18372D" />
      <stop offset="100%" stop-color="#10271F" />
    </linearGradient>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .pulse { animation: pulseGlow 2.5s infinite ease-in-out; }
      .text-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans", sans-serif; font-weight: 700; }
      .text-sub { font-family: "IBM Plex Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="960" height="260" rx="12" fill="#0A1C14" stroke="#234B3C" stroke-width="1.5" />

  <!-- Layer 1: Frontend -->
  <g transform="translate(30, 30)">
    <rect width="280" height="200" rx="10" fill="url(#cardBg)" stroke="#234B3C" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#234B3C" />
    <text x="40" y="46" text-anchor="middle" fill="#F7F4EC" font-size="20">⚡</text>
    <text x="70" y="38" fill="#F7F4EC" font-size="16" class="text-head">Next.js 14 &amp; Three.js</text>
    <text x="70" y="54" fill="#D6926F" font-size="11" class="text-sub">FRONTEND CLIENT</text>

    <g transform="translate(20, 80)">
      <text x="0" y="0" fill="#EDE7D8" font-size="12" class="text-head">&bull; App Router &amp; TypeScript</text>
      <text x="0" y="24" fill="#EDE7D8" font-size="12" class="text-head">&bull; Autonomous 3D Canvas</text>
      <text x="0" y="48" fill="#EDE7D8" font-size="12" class="text-head">&bull; Tailwind CSS &amp; Glassmorphism</text>
      <text x="0" y="72" fill="#EDE7D8" font-size="12" class="text-head">&bull; Google Stitch Design Export</text>
      <text x="0" y="96" fill="#38A169" font-size="11" class="text-sub">PORT: 3000</text>
    </g>
  </g>

  <!-- Animated Data Connector 1 -->
  <g transform="translate(310, 130)">
    <line x1="5" y1="0" x2="35" y2="0" stroke="#B8734E" stroke-width="3" stroke-dasharray="4 4" class="pulse" />
    <polygon points="35,0 27,-5 27,5" fill="#B8734E" />
  </g>

  <!-- Layer 2: Backend -->
  <g transform="translate(350, 30)">
    <rect width="280" height="200" rx="10" fill="url(#cardBg)" stroke="#B8734E" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#B8734E" />
    <text x="40" y="46" text-anchor="middle" fill="#F7F4EC" font-size="20">🚀</text>
    <text x="70" y="38" fill="#F7F4EC" font-size="16" class="text-head">FastAPI &amp; Uvicorn</text>
    <text x="70" y="54" fill="#D6926F" font-size="11" class="text-sub">ASYNC REST &amp; ENGINE</text>

    <g transform="translate(20, 80)">
      <text x="0" y="0" fill="#EDE7D8" font-size="12" class="text-head">&bull; Python 3.10+ Async Engine</text>
      <text x="0" y="24" fill="#EDE7D8" font-size="12" class="text-head">&bull; 15-Day SLA Ceiling Engine</text>
      <text x="0" y="48" fill="#EDE7D8" font-size="12" class="text-head">&bull; Pydantic v2 Models &amp; Schemas</text>
      <text x="0" y="72" fill="#EDE7D8" font-size="12" class="text-head">&bull; Swagger OpenAPI Auto-Docs</text>
      <text x="0" y="96" fill="#38A169" font-size="11" class="text-sub">PORT: 8000</text>
    </g>
  </g>

  <!-- Animated Data Connector 2 -->
  <g transform="translate(630, 130)">
    <line x1="5" y1="0" x2="35" y2="0" stroke="#B8734E" stroke-width="3" stroke-dasharray="4 4" class="pulse" />
    <polygon points="35,0 27,-5 27,5" fill="#B8734E" />
  </g>

  <!-- Layer 3: Persistence -->
  <g transform="translate(670, 30)">
    <rect width="260" height="200" rx="10" fill="url(#cardBg)" stroke="#234B3C" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#234B3C" />
    <text x="40" y="46" text-anchor="middle" fill="#F7F4EC" font-size="20">🍃</text>
    <text x="70" y="38" fill="#F7F4EC" font-size="16" class="text-head">MongoDB &amp; Seeds</text>
    <text x="70" y="54" fill="#D6926F" font-size="11" class="text-sub">DATABASE &amp; CACHE</text>

    <g transform="translate(20, 80)">
      <text x="0" y="0" fill="#EDE7D8" font-size="12" class="text-head">&bull; MongoDB Atlas / Local</text>
      <text x="0" y="24" fill="#EDE7D8" font-size="12" class="text-head">&bull; Zero-Config In-Memory Fallback</text>
      <text x="0" y="48" fill="#EDE7D8" font-size="12" class="text-head">&bull; Motor AsyncIO Driver</text>
      <text x="0" y="72" fill="#EDE7D8" font-size="12" class="text-head">&bull; SHA-256 Chained Audit Trail</text>
      <text x="0" y="96" fill="#38A169" font-size="11" class="text-sub">pravah_aicte_db</text>
    </g>
  </g>
</svg>
