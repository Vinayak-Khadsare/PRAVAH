<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3826" />
      <stop offset="50%" stop-color="#18372D" />
      <stop offset="100%" stop-color="#092015" />
    </linearGradient>
    
    <linearGradient id="pipelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8734E" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#D6926F" />
      <stop offset="50%" stop-color="#F2C09C" />
      <stop offset="75%" stop-color="#D6926F" />
      <stop offset="100%" stop-color="#B8734E" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="goldSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DF95" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.8  0 1 0 0 0.5  0 0 1 0 0.3  0 0 0 1 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#234B3C" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#B8734E" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes rotateSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes reverseRotate {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanRadar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .floating-title { animation: floatSlow 6s ease-in-out infinite; }
      .rotating-ring { transform-origin: 390px 310px; animation: rotateSlow 14s linear infinite; }
      .counter-ring { transform-origin: 390px 310px; animation: reverseRotate 10s linear infinite; }
      .pulse-node { transform-origin: center; animation: pulseCore 3s ease-in-out infinite; }
      .flowing-conduit { stroke-dasharray: 12 8; animation: dashFlow 20s linear infinite; }
      .radar-sweep { transform-origin: 600px 310px; animation: scanRadar 4s linear infinite; }
      .beacon { animation: blinkBeacon 2s ease-in-out infinite; }

      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans", sans-serif; font-weight: 800; letter-spacing: 6px; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans", sans-serif; font-weight: 500; letter-spacing: 2px; }
      .text-mono { font-family: "IBM Plex Mono", "SF Mono", Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="480" rx="16" fill="url(#gridPattern)" />
  <rect width="1200" height="480" rx="16" fill="none" stroke="#B8734E" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Top Status Telemetry Ribbon -->
  <g transform="translate(40, 32)">
    <rect width="1120" height="38" rx="8" fill="#132B20" fill-opacity="0.85" stroke="#234B3C" stroke-width="1" />
    
    <!-- Institutional Emblem Pill -->
    <rect x="12" y="7" width="170" height="24" rx="4" fill="#234B3C" />
    <circle cx="26" cy="19" r="5" fill="#397553" />
    <circle cx="26" cy="19" r="8" fill="none" stroke="#397553" stroke-width="1" class="beacon" />
    <text x="38" y="23" fill="#F7F4EC" font-size="11" font-weight="bold" class="text-mono">AICTE STATUTORY</text>

    <!-- Telemetry Badges -->
    <text x="210" y="23" fill="#D6926F" font-size="11" class="text-mono">SLA CEILING: <tspan fill="#F7F4EC" font-weight="bold">15-DAY STRICT</tspan></text>
    <circle cx="370" cy="19" r="2" fill="#B8734E" />

    <text x="390" y="23" fill="#D6926F" font-size="11" class="text-mono">ACTIVE DOSSIERS: <tspan fill="#F7F4EC" font-weight="bold">1,428 PENDING</tspan></text>
    <circle cx="585" cy="19" r="2" fill="#B8734E" />

    <text x="605" y="23" fill="#D6926F" font-size="11" class="text-mono">REGULATORY COMPLIANCE: <tspan fill="#38A169" font-weight="bold">94.2% ON TRACK</tspan></text>
    <circle cx="830" cy="19" r="2" fill="#B8734E" />

    <text x="850" y="23" fill="#D6926F" font-size="11" class="text-mono">SECURITY: <tspan fill="#F7F4EC">SHA-256 CHAINED</tspan></text>
    
    <!-- Live Status Dot -->
    <circle cx="1090" cy="19" r="5" fill="#38A169" class="pulse-node" />
  </g>

  <!-- Hero Platform Branding -->
  <g class="floating-title" transform="translate(600, 130)">
    <text x="0" y="0" text-anchor="middle" fill="#F7F4EC" font-size="54" class="text-title" filter="url(#glow)">PRAVAH</text>
    <text x="0" y="32" text-anchor="middle" fill="#D6926F" font-size="14" class="text-subtitle">AICTE REGULATORY APPROVAL OPERATIONS PLATFORM</text>
    <text x="0" y="56" text-anchor="middle" fill="#EDE7D8" fill-opacity="0.75" font-size="13" class="text-subtitle">Autonomous 3D Pipeline &bull; Form-B Scrutiny Desk &bull; Biometric EVC Inspection &bull; SAC Appeals</text>
  </g>

  <!-- Continuous 5-Stage Approval Pipeline Conduit -->
  <g id="pipeline-layer">
    <!-- Glow Backing -->
    <path d="M 120 310 C 240 280, 300 340, 390 310 C 480 280, 520 340, 600 310 C 680 280, 720 340, 810 310 C 900 280, 980 340, 1080 310" 
          fill="none" stroke="#B8734E" stroke-opacity="0.25" stroke-width="12" stroke-linecap="round" />

    <!-- Guide Sleeve -->
    <path d="M 120 310 C 240 280, 300 340, 390 310 C 480 280, 520 340, 600 310 C 680 280, 720 340, 810 310 C 900 280, 980 340, 1080 310" 
          fill="none" stroke="#EDE7D8" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round" />

    <!-- Core Dynamic Conduit -->
    <path id="pipelinePath" d="M 120 310 C 240 280, 300 340, 390 310 C 480 280, 520 340, 600 310 C 680 280, 720 340, 810 310 C 900 280, 980 340, 1080 310" 
          fill="none" stroke="url(#pipelineGrad)" stroke-width="3" stroke-linecap="round" class="flowing-conduit" />
  </g>

  <!-- Animated Traveling Dossier Capsules -->
  <g>
    <!-- Capsule 1 -->
    <g transform="translate(250, 292)" filter="url(#glow)">
      <circle cx="0" cy="0" r="7" fill="#F7F4EC" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="#B8734E" stroke-width="1.5" class="pulse-node" />
      <text x="0" y="-14" text-anchor="middle" fill="#F7F4EC" font-size="9" font-weight="bold" class="text-mono">APP-2026</text>
    </g>

    <!-- Capsule 2 -->
    <g transform="translate(710, 322)" filter="url(#glow)">
      <circle cx="0" cy="0" r="7" fill="#D6926F" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="#D6926F" stroke-width="1.5" class="pulse-node" />
      <text x="0" y="24" text-anchor="middle" fill="#D6926F" font-size="9" font-weight="bold" class="text-mono">EVC ROSTER</text>
    </g>

    <!-- Capsule 3 -->
    <g transform="translate(945, 292)" filter="url(#glow)">
      <circle cx="0" cy="0" r="7" fill="#38A169" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="#38A169" stroke-width="1.5" class="pulse-node" />
      <text x="0" y="-14" text-anchor="middle" fill="#38A169" font-size="9" font-weight="bold" class="text-mono">APPROVED</text>
    </g>
  </g>

  <!-- ================= STAGE 01: APPLICATION SUBMISSION ================= -->
  <g transform="translate(140, 310)">
    <!-- Stage Outer Dial -->
    <circle cx="0" cy="0" r="32" fill="#132B20" stroke="#B8734E" stroke-width="1.5" />
    <circle cx="0" cy="0" r="26" fill="#18372D" stroke="#234B3C" stroke-width="1" />
    <!-- Folio Dossier Icon -->
    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="#F7F4EC" fill-opacity="0.9" />
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#234B3C" stroke-width="1.5" />
    <line x1="-6" y1="-1" x2="6" y2="-1" stroke="#234B3C" stroke-width="1.5" />
    <line x1="-6" y1="4" x2="2" y2="4" stroke="#B8734E" stroke-width="1.5" />
    <!-- Stage Labels -->
    <text x="0" y="52" text-anchor="middle" fill="#F7F4EC" font-size="12" font-weight="bold" class="text-mono">01. INTAKE</text>
    <text x="0" y="68" text-anchor="middle" fill="#D6926F" font-size="10" class="text-subtitle">Submission &amp; Hash</text>
  </g>

  <!-- ================= STAGE 02: SCRUTINY & VERIFICATION ================= -->
  <g transform="translate(370, 310)">
    <!-- Rotating Dual Audit Rings -->
    <circle cx="0" cy="0" r="34" fill="#132B20" stroke="#B8734E" stroke-width="1" />
    <g class="rotating-ring">
      <circle cx="0" cy="0" r="28" fill="none" stroke="#D6926F" stroke-width="1.5" stroke-dasharray="8 6" />
    </g>
    <circle cx="0" cy="0" r="22" fill="#18372D" stroke="#234B3C" stroke-width="1" />
    <!-- Scrutiny Reticle -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#F7F4EC" stroke-width="1.5" />
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#B8734E" stroke-width="1.5" />
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#B8734E" stroke-width="1.5" />
    <!-- Stage Labels -->
    <text x="0" y="52" text-anchor="middle" fill="#F7F4EC" font-size="12" font-weight="bold" class="text-mono">02. SCRUTINY</text>
    <text x="0" y="68" text-anchor="middle" fill="#D6926F" font-size="10" class="text-subtitle">15-Day Audit Ceiling</text>
  </g>

  <!-- ================= STAGE 03: EVC ON-SITE INSPECTION ================= -->
  <g transform="translate(600, 310)">
    <!-- Radar Scanner -->
    <circle cx="0" cy="0" r="34" fill="#132B20" stroke="#B8734E" stroke-width="1" />
    <circle cx="0" cy="0" r="26" fill="#18372D" stroke="#234B3C" stroke-width="1" />
    <g class="radar-sweep">
      <line x1="0" y1="0" x2="24" y2="-12" stroke="#38A169" stroke-width="2" stroke-opacity="0.8" />
      <polygon points="0,0 24,-12 20,-20" fill="#38A169" fill-opacity="0.25" />
    </g>
    <!-- Neoclassical Colonnade (3 Pillars) -->
    <rect x="-10" y="-8" width="4" height="16" fill="#F7F4EC" />
    <rect x="-2" y="-8" width="4" height="16" fill="#F7F4EC" />
    <rect x="6" y="-8" width="4" height="16" fill="#F7F4EC" />
    <rect x="-12" y="-12" width="24" height="3" fill="#D6926F" />
    <rect x="-12" y="8" width="24" height="3" fill="#D6926F" />
    <!-- Stage Labels -->
    <text x="0" y="52" text-anchor="middle" fill="#F7F4EC" font-size="12" font-weight="bold" class="text-mono">03. EVC VISIT</text>
    <text x="0" y="68" text-anchor="middle" fill="#D6926F" font-size="10" class="text-subtitle">Geofenced 3-Panel</text>
  </g>

  <!-- ================= STAGE 04: SAC / SHC APPELLATE ================= -->
  <g transform="translate(830, 310)">
    <!-- Balance Dais -->
    <circle cx="0" cy="0" r="34" fill="#132B20" stroke="#B8734E" stroke-width="1" />
    <circle cx="0" cy="0" r="26" fill="#18372D" stroke="#234B3C" stroke-width="1" />
    <!-- Scales of Deliberation -->
    <line x1="-12" y1="-6" x2="12" y2="-4" stroke="#F7F4EC" stroke-width="2" />
    <line x1="0" y1="-8" x2="0" y2="10" stroke="#D6926F" stroke-width="2" />
    <path d="M -16 4 Q -12 10 -8 4 Z" fill="#F7F4EC" />
    <path d="M 8 6 Q 12 12 16 6 Z" fill="#F7F4EC" />
    <!-- Stage Labels -->
    <text x="0" y="52" text-anchor="middle" fill="#F7F4EC" font-size="12" font-weight="bold" class="text-mono">04. SAC / SHC</text>
    <text x="0" y="68" text-anchor="middle" fill="#D6926F" font-size="10" class="text-subtitle">Appellate Standing</text>
  </g>

  <!-- ================= STAGE 05: AUTHORISED APPROVAL ================= -->
  <g transform="translate(1060, 310)">
    <!-- Gold Rosette Council Seal -->
    <circle cx="0" cy="0" r="36" fill="url(#goldSealGrad)" filter="url(#pulseGlow)" class="pulse-node" />
    <circle cx="0" cy="0" r="28" fill="#132B20" stroke="#F3DF95" stroke-width="1.5" />
    <!-- Emerald Core Star -->
    <circle cx="0" cy="0" r="16" fill="#0F3826" stroke="#38A169" stroke-width="2" />
    <path d="M 0 -8 L 2 -2 L 8 -2 L 3 2 L 5 8 L 0 4 L -5 8 L -3 2 L -8 -2 L -2 -2 Z" fill="#F3DF95" />
    <!-- Stage Labels -->
    <text x="0" y="52" text-anchor="middle" fill="#F7F4EC" font-size="12" font-weight="bold" class="text-mono">05. DECISION</text>
    <text x="0" y="68" text-anchor="middle" fill="#38A169" font-size="10" font-weight="bold" class="text-subtitle">Approval Granted</text>
  </g>

  <!-- Bottom Fast-Action Bar -->
  <g transform="translate(40, 420)">
    <rect width="1120" height="38" rx="8" fill="#0D2117" stroke="#234B3C" stroke-width="1" />
    <text x="24" y="24" fill="#EDE7D8" font-size="12" class="text-mono">⚡ QUICK START: <tspan fill="#F7F4EC" font-weight="bold">double-click start.bat</tspan> or run <tspan fill="#D6926F">python -m uvicorn backend.main:app</tspan> &amp; <tspan fill="#D6926F">npm run dev</tspan></text>
    <text x="1096" y="24" text-anchor="end" fill="#D6926F" font-size="11" class="text-mono">Next.js 14 &bull; Three.js &bull; FastAPI &bull; MongoDB</text>
  </g>
</svg>
